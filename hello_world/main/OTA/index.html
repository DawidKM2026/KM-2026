<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>KM projekt 2026</title>
</head>

<body>

        <h1>Aktualizacja:</h1>
        <input type="file" id="plik" style="display: none;">
        <label for="plik" style="
                background: #007bff;
                color: white;
                padding: 10px 15px;
                border-radius: 5px;
                cursor: pointer;
                display: inline-block;
                font-size: x-large;">
            Wybierz plik
        </label>
        <button onclick="uploadFirmware()" style="
                background: #007bff;
                color: white;
                padding: 10px 15px;
                border-radius: 5px;
                cursor: pointer;
                display: inline-block;
                font-size: x-large;">
            Prześlij
        </button>
        <script>

            function uploadFirmware() {
                let file = document.getElementById("plik").files[0];

                fetch("/update", {
                    method: "POST",
                    body: file
                })
                    .then(response => response.text())
                    .then(text => {
                        alert(text);
                    });
            }

        </script>
    </div>


</body>

</html>
